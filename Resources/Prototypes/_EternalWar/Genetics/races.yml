# Block 2 of the genome: which creature the genome builds.
# Ranges are written in hex, exactly as the genome scanner shows them.
# Animals take 00-FF (the closer to 100, the closer to a human), humans 100-200.
# Other species will go above 200 later; for now the block can't go higher.

- type: genomeRace
  id: Cockroach
  name: genome-race-cockroach
  from: "00"
  to: "0F"
  polymorph: GenomeCockroach

