# What a human turns into when the race block of their genome points at an animal.
# The change is genetic, so it doesn't wear off on crit or death:
# only editing the genome back to a human value reverts it.

- type: polymorph
  id: GenomeCockroach
  configuration:
    entity: MobCockroach
    forced: true
    inventory: Drop
    transferName: true
    transferDamage: true
    revertOnCrit: false
    revertOnDeath: false

