# Muscles and blood vessels of the body zones. BodyZonesSystem spawns them, like the bones.
# The vessels carry the blood from the heart through the zones (Circulation); the muscles are only structure for now.

- type: entity
  parent:
  - OrganBase
  - OrganBaseChildInternal
  id: MusclesBase
  name: muscles
  abstract: true
  components:
  - type: OrganHealth # torn at 0
    maxHealth: 20
  - type: GibbableOrgan
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
    state: muscle
  - type: Item
    size: Small

- type: entity
  parent:
  - OrganBase
  - OrganBaseChildInternal
  id: VesselsBase
  name: blood vessels
  abstract: true
  components:
  - type: OrganHealth # torn at 0
    maxHealth: 15
  - type: GibbableOrgan
  - type: BloodVessel # blood reaches the zone and the zones below only through them
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
    state: vessel
  - type: Item
    size: Tiny

