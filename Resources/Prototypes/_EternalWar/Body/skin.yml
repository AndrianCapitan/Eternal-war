# Skin of the body zones. BodyZonesSystem spawns it, like the bones.
# It has its own health: slashes and burns wear it down first, at 0 it is torn off. A sharp tool takes it off too.
# Without it the zone bleeds and takes more damage.

- type: entity
  parent:
  - OrganBase
  - OrganBaseChildInternal
  id: SkinBase
  name: skin
  abstract: true
  components:
  - type: OrganHealth # torn off at 0
    maxHealth: 15
  - type: GibbableOrgan
  - type: Sprite
    sprite: _EternalWar/Objects/Specific/Medical/organs.rsi
    state: skin
  - type: Item
    size: Small

- type: entity
  parent: SkinBase
  id: SkinFace
  name: face skin
  components:
  - type: Organ
    category: SkinFace

