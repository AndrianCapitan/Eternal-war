# Organs of the Eternal War anatomy. Humans get them through their InitialBody (Body/Species/human.yml),
# the sex organs are spawned by BodyZonesSystem by the mob's sex.

# Upper arm and thigh: they hold the upstream arm (forearm) and leg (shin), so tearing them off takes the whole limb.
# They have no sprite on the body of their own: the forearm and shin sprites cover the whole limb.

- type: entity
  parent:
  - OrganBase
  - OrganBaseParent
  - OrganBaseChildExternal
  id: OrganBaseUpperArmLeft
  name: left upper arm
  abstract: true
  components:
  - type: Organ
    category: UpperArmLeft
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
    state: l_arm

- type: entity
  parent:
  - OrganBase
  - OrganBaseParent
  - OrganBaseChildExternal
  id: OrganBaseUpperArmRight
  name: right upper arm
  abstract: true
  components:
  - type: Organ
    category: UpperArmRight
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
    state: r_arm

- type: entity
  parent:
  - OrganBase
  - OrganBaseParent
  - OrganBaseChildExternal
  id: OrganBaseThighLeft
  name: left thigh
  abstract: true
  components:
  - type: Organ
    category: ThighLeft
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
    state: l_leg

- type: entity
  parent:
  - OrganBase
  - OrganBaseParent
  - OrganBaseChildExternal
  id: OrganBaseThighRight
  name: right thigh
  abstract: true
  components:
  - type: Organ
    category: ThighRight
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
    state: r_leg

- type: entity
  parent: [ OrganBaseUpperArmLeft, OrganHuman ]
  id: OrganHumanUpperArmLeft
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
    state: l_arm

- type: entity
  parent: [ OrganBaseUpperArmRight, OrganHuman ]
  id: OrganHumanUpperArmRight
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
    state: r_arm

- type: entity
  parent: [ OrganBaseThighLeft, OrganHuman ]
  id: OrganHumanThighLeft
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
    state: l_leg

- type: entity
  parent: [ OrganBaseThighRight, OrganHuman ]
  id: OrganHumanThighRight
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
    state: r_leg

# Eyes. Each draws itself on the face: the left one on the upstream eyes layer, the right one on its own,
# so a lost eye disappears from the face alone. Blinking belongs to the eyelids, so it lives on the head.

- type: entity
  parent:
  - OrganBase
  - OrganBaseChildInternal
  - OrganHuman
  id: OrganHumanEyeBase
  abstract: true
  components:
  - type: GibbableOrgan
  - type: Item
    size: Tiny
    heldPrefix: eyeballs

- type: entity
  parent: OrganHumanEyeBase
  id: OrganHumanEyeLeft
  name: left eye
  components:
  - type: Organ
    category: EyeLeft
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
    layers:
    - state: eyeball-l
  - type: VisualOrgan
    layer: enum.HumanoidVisualLayers.Eyes
    data:
      sprite: _EternalWar/Mobs/Customization/eyes.rsi
      state: eye_left
  - type: VisualOrganMarkings
    markingData:
      group: Human
      layers:
      - Eyes
      - OverEyes

- type: entity
  parent: OrganHumanEyeBase
  id: OrganHumanEyeRight
  name: right eye
  components:
  - type: Organ
    category: EyeRight
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
    layers:
    - state: eyeball-r
  - type: VisualOrgan
    layer: enum.EternalWarHumanoidLayers.RightEye
    data:
      sprite: _EternalWar/Mobs/Customization/eyes.rsi
      state: eye_right

# Inner ears, one per side. Each hears half (OrganFunctionsComponent).

- type: entity
  parent: OrganHumanEars
  id: OrganHumanEarLeft
  name: left inner ear
  components:
  - type: Organ
    category: EarLeft

- type: entity
  parent: OrganHumanEars
  id: OrganHumanEarRight
  name: right inner ear
  components:
  - type: Organ
    category: EarRight

# Lungs. Each breathes on its own, see BodyZonesComponent for life with one.

- type: entity
  parent: OrganHumanLungs
  id: OrganHumanLungLeft
  name: left lung
  components:
  - type: Organ
    category: LungLeft
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
    layers:
    - state: lung-l

- type: entity
  parent: OrganHumanLungs
  id: OrganHumanLungRight
  name: right lung
  components:
  - type: Organ
    category: LungRight
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
    layers:
    - state: lung-r

# Abdomen.

# Kidneys, each on its own. Like upstream's pair they take part in no metabolism stage:
# they clean the body of poison with the liver (OrganFunctionsComponent.Detox).

- type: entity
  parent: OrganHumanKidneys
  id: OrganHumanKidneyLeft
  name: left kidney
  components:
  - type: Organ
    category: KidneyLeft
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
    layers:
    - state: kidney-l

- type: entity
  parent: OrganHumanKidneys
  id: OrganHumanKidneyRight
  name: right kidney
  components:
  - type: Organ
    category: KidneyRight
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi
    layers:
    - state: kidney-r

- type: entity
  parent:
  - OrganBase
  - OrganBaseChildInternal
  id: OrganBaseSpleen
  name: spleen
  abstract: true
  components:
  - type: GibbableOrgan
  - type: Organ
    category: Spleen
  - type: Sprite
    sprite: _EternalWar/Objects/Specific/Medical/organs.rsi
    state: spleen
  - type: Item
    size: Small

- type: entity
  parent:
  - OrganBase
  - OrganBaseChildInternal
  id: OrganBaseIntestines
  name: intestines
  abstract: true
  components:
  - type: GibbableOrgan
  - type: Organ
    category: Intestines
  - type: Sprite
    sprite: _EternalWar/Objects/Specific/Medical/organs.rsi
    state: intestines
  - type: Item
    size: Normal

- type: entity
  parent: [ OrganBaseSpleen, OrganHuman ]
  id: OrganHumanSpleen
  components:
  - type: Sprite
    sprite: _EternalWar/Objects/Specific/Medical/organs.rsi
    state: spleen

# The intestines digest what the stomach passed on (a solution on the body, see OrganFunctionsComponent),
# the way upstream's stomach did: food feeds, the rest goes into the blood at half strength.
- type: entity
  parent: [ OrganBaseIntestines, OrganHuman, OrganHumanMetabolizer ]
  id: OrganHumanIntestines
  components:
  - type: Metabolizer
    maxReagents: 3
    stages: [ Digestion ]
    solutions:
      Digestion:
        solutionName: intestines
        transferSolutionName: bloodstream
        transferEfficacy: 0.5
  - type: Sprite
    sprite: _EternalWar/Objects/Specific/Medical/organs.rsi
    state: intestines

