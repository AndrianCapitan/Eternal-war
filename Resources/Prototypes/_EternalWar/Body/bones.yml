# Bones live inside body zones (see BodyZonesComponent). Each has its own health: cracked at 75%, broken below 50%.
# Only crushing and piercing damage reach them, blades don't.
# They are spawned by BodyZonesSystem, not by InitialBody, so every species gets them without editing it.
# A destroyed zone keeps its bone in the body (the skull, the ribs...) or loses it with the part (a limb),
# only 5% of the time it is knocked out. The bones of the head and torso laid bare are pulled out with the
# take-apart key (middle mouse), held together as one of the assemblies at the end of this file.

- type: entity
  parent:
  - OrganBase
  - OrganBaseChildInternal
  id: BoneBase
  name: bone
  abstract: true
  components:
  - type: OrganHealth # cracks at 75% of it, breaks below 50%
    maxHealth: 20
  - type: GibbableOrgan
  - type: Bone
  - type: Sprite
    sprite: _EternalWar/Objects/Specific/Medical/bones.rsi
  - type: Item
    size: Small

- type: entity
  parent: BoneBase
  id: BoneSkull
  name: skull
  components:
  - type: OrganHealth
    maxHealth: 30
  - type: Bone
    vital: true # pulling it out of a living body kills
  - type: Organ
    category: BoneSkull
  - type: Sprite
    state: skull

- type: entity
  parent: BoneBase
  id: BoneJaw
  name: jaw
  components:
  - type: OrganHealth
    maxHealth: 15
  - type: Organ
