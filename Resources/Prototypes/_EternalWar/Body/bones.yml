# Bones still held together. The bones themselves are in the "bones" container; which prototype holds them is
# picked by the combination (BoneAssemblyComponent.Bones), the biggest that fits.

- type: entity
  parent: BaseItem
  id: BoneAssemblyBase
  abstract: true
  components:
  - type: Sprite
    sprite: _EternalWar/Objects/Specific/Medical/bones.rsi
  - type: Item
    size: Normal
  - type: ContainerContainer
    containers:
      bones: !type:Container
  - type: Damageable # crushing blows break a spine

- type: entity
  parent: BoneAssemblyBase
  id: BoneAssemblySkeleton
  name: skeleton
  description: A skull, the spine, the ribs and the pelvis, all still held together.
  components:
  - type: Sprite
    state: skeleton
  - type: Item
    size: Large
  - type: BoneAssembly
    bones: [ BoneSkull, BoneJaw, BoneSpineThoracic, BoneSpineLumbar, BoneRibs, BonePelvis ]
    takeOut: [ BoneSkull, BoneJaw ]

- type: entity
  parent: BoneAssemblyBase
  id: BoneAssemblyTrunk
  name: pelvis, spine and ribs
  description: The bones of a torso, still held together.
  components:
  - type: Sprite
    state: trunk
  - type: Item
    size: Large
  - type: BoneAssembly
    bones: [ BoneSpineThoracic, BoneSpineLumbar, BoneRibs, BonePelvis ]
    takeOut: [ BoneRibs ]

- type: entity
  parent: BoneAssemblyBase
  id: BoneAssemblyPelvisSpine
  name: pelvis and spine
  description: A spine still set in the pelvis.
  components:
  - type: Sprite
    state: pelvis_spine
  - type: BoneAssembly
    bones: [ BoneSpineThoracic, BoneSpineLumbar, BonePelvis ]
    takeOut: [ BonePelvis ]

- type: entity
  parent: BoneAssemblyBase
  id: BoneAssemblyRibsSpine
  name: ribs and spine
  description: A ribcage still hanging on the spine.
  components:
  - type: Sprite
    state: ribs_spine
  - type: BoneAssembly
    bones: [ BoneSpineThoracic, BoneSpineLumbar, BoneRibs ]
    takeOut: [ BoneRibs ]

- type: entity
  parent: BoneAssemblyBase
  id: BoneAssemblySpine
  name: spine
  description: A whole spine. Too strong to pull apart by hand.
  components:
  - type: Sprite
    state: spine
  - type: BoneAssembly
    bones: [ BoneSpineThoracic, BoneSpineLumbar ]
    splitOff: [ BoneSpineLumbar ]

- type: entity
  parent: BoneAssemblyBase
  id: BoneAssemblySkullJaw
  name: skull with jaw
  description: A skull with its lower jaw.
  components:
  - type: Sprite
    state: skull_jaw
  - type: Item
    size: Small
  - type: BoneAssembly
    bones: [ BoneSkull, BoneJaw ]
    takeOut: [ BoneJaw ]
