- type: entity
  abstract: true
  id: BaseSpeciesLayers
  components:
  - type: Sprite
    layers:
    # Torso
    - map: [ "enum.HumanoidVisualLayers.Chest" ]
    - map: [ "enum.EternalWarHumanoidLayers.ExposedChest" ] # Eternal War: skin, bare muscles or bones of the zone
    - map: [ "enum.EternalWarHumanoidLayers.ExposedAbdomen" ] # Eternal War: skin, bare muscles or bones of the zone

    # Head
    - map: [ "enum.HumanoidVisualLayers.Head" ]
    - map: [ "enum.EternalWarHumanoidLayers.ExposedHead" ] # Eternal War: skin, bare muscles or bones of the zone
    - map: [ "enum.HumanoidVisualLayers.Snout" ]
    - map: [ "enum.HumanoidVisualLayers.Eyes" ]
    - map: [ "enum.EternalWarHumanoidLayers.RightEye" ] # Eternal War: the right eye is drawn separately
    - map: [ "enum.HumanoidVisualLayers.Eyelids" ]
    - map: [ "enum.HumanoidVisualLayers.OverEyes" ]

    # Limbs
    - map: [ "enum.HumanoidVisualLayers.RArm" ]
    - map: [ "enum.EternalWarHumanoidLayers.ExposedRUpperArm" ] # Eternal War: skin, bare muscles or bones of the zone
    - map: [ "enum.EternalWarHumanoidLayers.ExposedRForearm" ] # Eternal War: skin, bare muscles or bones of the zone
    - map: [ "enum.HumanoidVisualLayers.LArm" ]
    - map: [ "enum.EternalWarHumanoidLayers.ExposedLUpperArm" ] # Eternal War: skin, bare muscles or bones of the zone
    - map: [ "enum.EternalWarHumanoidLayers.ExposedLForearm" ] # Eternal War: skin, bare muscles or bones of the zone
    - map: [ "enum.HumanoidVisualLayers.RLeg" ]
    - map: [ "enum.EternalWarHumanoidLayers.ExposedRThigh" ] # Eternal War: skin, bare muscles or bones of the zone
    - map: [ "enum.EternalWarHumanoidLayers.ExposedRShin" ] # Eternal War: skin, bare muscles or bones of the zone
    - map: [ "enum.HumanoidVisualLayers.LLeg" ]
    - map: [ "enum.EternalWarHumanoidLayers.ExposedLThigh" ] # Eternal War: skin, bare muscles or bones of the zone
    - map: [ "enum.EternalWarHumanoidLayers.ExposedLShin" ] # Eternal War: skin, bare muscles or bones of the zone

    # Underwear & clothing
    - map: [ "enum.HumanoidVisualLayers.UndergarmentBottom" ]
    - map: [ "enum.HumanoidVisualLayers.UndergarmentTop" ]
    - map: ["jumpsuit"]

    # Extremities
    - map: ["enum.HumanoidVisualLayers.LFoot"]
    - map: [ "enum.EternalWarHumanoidLayers.ExposedLFoot" ] # Eternal War: skin, bare muscles or bones of the zone
    - map: ["enum.HumanoidVisualLayers.RFoot"]
    - map: [ "enum.EternalWarHumanoidLayers.ExposedRFoot" ] # Eternal War: skin, bare muscles or bones of the zone
    - map: ["enum.HumanoidVisualLayers.LHand"]
    - map: [ "enum.EternalWarHumanoidLayers.ExposedLHand" ] # Eternal War: skin, bare muscles or bones of the zone
    - map: ["enum.HumanoidVisualLayers.RHand"]
    - map: [ "enum.EternalWarHumanoidLayers.ExposedRHand" ] # Eternal War: skin, bare muscles or bones of the zone

    # Stuff that goes over the body but below equipment
    - map: ["enum.HumanoidVisualLayers.Overlay"]

    # More equipment
    - map: [ "gloves" ]
    - map: [ "shoes" ]
    - map: [ "ears" ]
    - map: [ "eyes" ]
    - map: [ "belt" ]
    - map: [ "id" ]
    - map: [ "outerClothing" ]
    - map: [ "back" ]
    - map: [ "neck" ]
    - map: [ "suitstorage" ]

    # Stuff that goes in front of equipment
    - map: [ "enum.HumanoidVisualLayers.SnoutCover" ]
    - map: [ "enum.HumanoidVisualLayers.FacialHair" ]
    - map: [ "enum.HumanoidVisualLayers.Hair" ]
    - map: [ "enum.HumanoidVisualLayers.HeadSide" ]
    - map: [ "enum.HumanoidVisualLayers.HeadTop" ]
    - map: [ "enum.HumanoidVisualLayers.Tail" ]
    - map: [ "enum.HumanoidVisualLayers.TailOverlay" ]

    # Stuff that goes in front of stuff that goes in front of equipment
    - map: [ "mask" ]
    - map: [ "head" ]
    - map: [ "pocket1" ]
    - map: [ "pocket2" ]

    # Extra stuff
    - map: ["enum.HumanoidVisualLayers.Handcuffs"]
      color: "#ffffff"
      sprite: Objects/Misc/handcuffs.rsi
      state: body-overlay-2
      visible: false

- type: entity
  id: BaseSpeciesAppearance
  parent:
  - InventoryBase
  - BaseSpeciesLayers
  abstract: true
  save: false
  components:
  - type: Body
  - type: VisualBody
  - type: Hands
  - type: ComplexInteraction
  - type: ContainerContainer
  - type: Appearance
  - type: HideableHumanoidLayers
  - type: UserInterface
    interfaces:
      enum.HumanoidMarkingModifierKey.Key:
        type: HumanoidMarkingModifierBoundUserInterface
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
  - type: InitialBody
    relationships:
      Torso: [Head, ArmLeft, ArmRight, LegLeft, LegRight, Appendix, Lungs, Heart, Stomach, Liver, Kidneys]
      Head: [Brain, Eyes, Tongue, Ears]
      ArmLeft: [HandLeft]
      ArmRight: [HandRight]
      LegLeft: [FootLeft]
      LegRight: [FootRight]
