- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceHuman
  categories: [ HideSpawnMenu ]
  name: human appearance
  components:
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  # Eternal War: the human anatomy is split into body zones (see BodyZonesComponent).
  # Upper arms and thighs hold the forearms (ArmLeft) and shins (LegLeft), eyes, ears, lungs and kidneys are separate.
  # Bones, muscles, vessels and sex organs are added by BodyZonesSystem.
  - type: InitialBody
    organs:
      Torso: OrganHumanTorso
      Head: OrganHumanHead
      UpperArmLeft: OrganHumanUpperArmLeft
      UpperArmRight: OrganHumanUpperArmRight
      ArmLeft: OrganHumanArmLeft
      ArmRight: OrganHumanArmRight
      HandRight: OrganHumanHandRight
      HandLeft: OrganHumanHandLeft
      ThighLeft: OrganHumanThighLeft
      ThighRight: OrganHumanThighRight
      LegLeft: OrganHumanLegLeft
      LegRight: OrganHumanLegRight
      FootLeft: OrganHumanFootLeft
      FootRight: OrganHumanFootRight
      Brain: OrganHumanBrain
      EyeLeft: OrganHumanEyeLeft
      EyeRight: OrganHumanEyeRight
      Tongue: OrganHumanTongue
      Appendix: OrganHumanAppendix
      EarLeft: OrganHumanEarLeft
      EarRight: OrganHumanEarRight
      LungLeft: OrganHumanLungLeft
      LungRight: OrganHumanLungRight
      Heart: OrganHumanHeart
      Stomach: OrganHumanStomach
      Liver: OrganHumanLiver
      KidneyLeft: OrganHumanKidneyLeft
      KidneyRight: OrganHumanKidneyRight
      Spleen: OrganHumanSpleen
      Intestines: OrganHumanIntestines
    relationships:
      Torso: [Head, UpperArmLeft, UpperArmRight, ThighLeft, ThighRight, Appendix, LungLeft, LungRight, Heart, Stomach, Liver, KidneyLeft, KidneyRight, Spleen, Intestines]
      Head: [Brain, EyeLeft, EyeRight, Tongue, EarLeft, EarRight]
      UpperArmLeft: [ArmLeft]
      UpperArmRight: [ArmRight]
      ArmLeft: [HandLeft]
      ArmRight: [HandRight]
      ThighLeft: [LegLeft]
      ThighRight: [LegRight]
      LegLeft: [FootLeft]
      LegRight: [FootRight]
  - type: HumanoidProfile
    species: Human

- type: entity
  parent:
  - AppearanceHuman
  - BaseSpeciesMobOrganic
  id: MobHuman
  name: Urist McHands
  components:
  # Eternal War: the tongue, ears, liver, kidneys, stomach, intestines, appendix and spleen at work.
  - type: OrganFunctions
  - type: Butcherable
    spawned:
    - id: FoodMeatHuman
      amount: 5

- type: entity
  parent: OrganBaseOrganic
  id: OrganHuman
  abstract: true
  suffix: human

- type: entity
  id: OrganHumanMetabolizer
  abstract: true
  components:
  - type: Metabolizer
    metabolizerTypes: [ Human ]

- type: entity
  parent: OrganHuman
  id: OrganHumanInternal
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/organs.rsi

- type: entity
  parent: OrganHuman
  id: OrganHumanExternal
  abstract: true
  components:
  - type: Sprite
    sprite: Mobs/Species/Human/parts.rsi
  - type: VisualOrgan
    data:
      sprite: Mobs/Species/Human/parts.rsi
  - type: VisualOrganMarkings
    markingData:
      group: Human

- type: entity
  parent: [ OrganBaseTorsoSexed, OrganBaseTorso, OrganHumanExternal ]
  id: OrganHumanTorso

- type: entity
  parent: [ OrganBaseHeadSexed, OrganBaseHead, OrganHumanExternal ]
  id: OrganHumanHead
  components:
  - type: VisualOrganMarkings
    hideableLayers:
    - enum.HumanoidVisualLayers.Hair
    - enum.HumanoidVisualLayers.Snout
    - enum.HumanoidVisualLayers.FacialHair
  # Eternal War: the eyelids blink on the head, the two eyes are separate organs.
  - type: EyeBlinking
    eyelidsSprite: /Textures/Mobs/Species/Human/parts.rsi
  - type: Appearance

